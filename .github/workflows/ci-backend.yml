name: Backend CI - Integración Continua

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**' # Solo se ejecuta si hay cambios en el backend
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Postgres efímero solo para este job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub_test

    # Define la carpeta de trabajo por defecto para todos los comandos
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Necesario para que Jest cargue módulos ESM (require(esm))
        cache: 'npm'
        cache-dependency-path: ./backend/package-lock.json

    - name: 📦 Instalar dependencias
      run: npm ci # Instalación limpia basada en package-lock.json

    - name: 🔧 Generar cliente de Prisma
      run: npx prisma generate

    - name: 🗄️ Aplicar migraciones
      run: npx prisma migrate deploy

    - name: 🧪 Ejecutar Pruebas (TDD)
      run: npm run test